name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v6.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent; then
            echo "::error::Tag $RELEASE_TAG does not exist. Push the tag first, then run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Versions match the tag
        run: node scripts/check-version.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundle-files: globs relative to src-tauri/, separated by spaces
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            rust-targets: ''
            target-args: ''
            bundle-files: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
          - name: windows
            os: windows-latest
            bundles: nsis
            rust-targets: ''
            target-args: ''
            bundle-files: target/release/bundle/nsis/*-setup.exe
          - name: macos
            os: macos-latest
            bundles: app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            target-args: --target universal-apple-darwin
            bundle-files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # Code signing is optional. Without secrets the Windows installer is
      # unsigned and the macOS app is ad-hoc signed (bundle.macOS.signingIdentity
      # "-"). docs/releasing.md lists the secrets that turn signing on.
      - name: Build bundles
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$SECRET_APPLE_CERTIFICATE" ] && [ -n "$SECRET_APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with the Developer ID certificate from repository secrets"
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY"
            if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
              echo "Notarizing with the Apple ID from repository secrets"
              export APPLE_ID="$SECRET_APPLE_ID"
              export APPLE_PASSWORD="$SECRET_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          fi
          npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target-args }}

      # With several paths, upload-artifact keeps the folders below their
      # common parent (appimage/, deb/). Gather the files into one flat folder
      # so the publish job finds every bundle at the top level.
      - name: Collect bundles
        working-directory: src-tauri
        run: |
          shopt -s nullglob
          files=(${{ matrix.bundle-files }})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::tauri build produced none of: ${{ matrix.bundle-files }}"
            exit 1
          fi
          mkdir -p ../release-bundles
          cp -v "${files[@]}" ../release-bundles/

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: release-bundles/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: release-artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          files=(*.AppImage *.deb *.exe *.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS.txt

      - name: Release notes
        run: node scripts/changelog-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      # Safe to re-run: an existing release keeps its notes and flags, and
      # assets with the same name are replaced.
      - name: Create release and upload assets
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, replacing its assets"
          else
            channel=--latest
            case "$RELEASE_TAG" in *-*) channel=--prerelease ;; esac
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "$channel" \
              || gh release view "$RELEASE_TAG" > /dev/null
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
