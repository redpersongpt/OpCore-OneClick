name: Bug report
description: Report a reproducible problem in OpCore-OneClick
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please make it reproducible.
        A support log helps most: Settings → Export support log, then attach the file below.
        Settings → Report a problem opens a pre-filled issue with a summary of your hardware and build.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure in one or two paragraphs.
      placeholder: The EFI build fails after the kext downloads and the app shows...
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: Where did it fail?
      options:
        - Hardware scan or profile import
        - Hardware review (wrong or missing device)
        - Compatibility / macOS version choice
        - BIOS checklist
        - EFI build
        - Recovery download
        - Writing the USB drive
        - Booting the USB (OpenCore picker or macOS installer)
        - After installing macOS (post-install)
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Scan hardware
        3. Pick macOS Sequoia
        4. Start the build
        5. Observe the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: host_os
    attributes:
      label: Host OS (where the app runs)
      options:
        - Windows 10/11
        - Linux
        - macOS (building for another PC)
    validations:
      required: true

  - type: dropdown
    id: target_macos
    attributes:
      label: Target macOS
      options:
        - macOS 26 Tahoe
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - macOS 13 Ventura
        - macOS 12 Monterey
        - macOS 11 Big Sur
        - macOS 10.15 Catalina
        - macOS 10.14 Mojave
        - macOS 10.13 High Sierra
        - Not relevant
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: 6.0.0
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU(s), motherboard or laptop model, network chipset, storage model if relevant
      placeholder: |
        CPU: Intel Core i7-10700K
        GPU: AMD RX 6600 + Intel UHD 630
        Motherboard: ASUS Z490...
        Wi-Fi: Intel AX200
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach the exported support log, or paste the relevant error, log tail or screenshots. Remove anything you consider private first.
    validations:
      required: false
